name: Build and release
# Every push and pull request type-checks and packages Windows and Linux. A push to main whose
# package.json version has no GitHub release yet publishes one with both platforms' packages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            files: release/*.exe
          # The oldest supported runner sets the glibc floor for the Linux packages.
          - platform: linux
            os: ubuntu-22.04
            files: |
              release/*.AppImage
              release/*.deb
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: SfxChat-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; bump the version in package.json to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2> /dev/null || true)"
          {
            echo "## Install"
            echo
            echo "- **Windows x64:** run \`SfxChat-Setup-${TAG#v}.exe\`. The installer is unsigned, so SmartScreen may ask you to choose **More info → Run anyway**."
            echo "- **Debian/Ubuntu x64:** \`sudo apt install ./SfxChat-${TAG#v}-amd64.deb\`, then open SfxChat from the app menu. Installs the \`sfxchat\` agent CLI."
            echo "- **Other Linux x64:** \`chmod +x SfxChat-${TAG#v}-x86_64.AppImage\` and run it (needs FUSE 2, e.g. \`libfuse2\`). Agent CLI/MCP integration needs the .deb."
            echo
            echo "Saving API keys on Linux needs a running Secret Service keyring such as GNOME Keyring or KWallet."
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then git log --no-merges --format='- %s' "$previous..HEAD"; else git log --no-merges --format='- %s' -n 20; fi
          } > notes.md
          gh release create "$TAG" packages/* --target "$GITHUB_SHA" --title "SfxChat $TAG" --notes-file notes.md

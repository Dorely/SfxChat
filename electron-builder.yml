appId: com.dorely.sfxchat
productName: SfxChat
directories:
  output: release
files:
  - out/**/*
  - '!out/agent/**/*'
  - '!out/skill/**/*'
  - '!out/native-build/**/*'
  - '!out/native-sources/**/*'
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - third-party/**/*
extraResources:
  - from: out/agent
    to: agent
  - from: out/skill
    to: skill
  - from: resources/soundfonts
    to: soundfonts
  - from: resources/icon.ico
    to: icon.ico
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/mpg123-decoder/**/*
  - node_modules/js-synthesizer/**/*
  - out/renderer/libfluidsynth-2.4.6.js
  - third-party/**/*
win:
  target: nsis
  icon: resources/icon.ico
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  license: LICENSE
  include: installer/agent.nsh
npmRebuild: true

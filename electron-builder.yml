appId: com.dorely.sfxchat
productName: SfxChat
directories:
  output: release
files:
  - out/**/*
  - '!out/agent/**/*'
  - '!out/skill/**/*'
  - '!out/native-build/**/*'
  - '!out/native-sources/**/*'
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - third-party/**/*
extraResources:
  - from: out/agent
    to: agent
  - from: out/skill
    to: skill
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/mpg123-decoder/**/*
  - third-party/**/*
win:
  target: nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  license: LICENSE
  include: installer/agent.nsh
npmRebuild: true

appId: com.dorely.sfxchat
productName: SfxChat
directories:
  output: release
files:
  - out/**/*
  - '!out/agent/**/*'
  - '!out/skill/**/*'
  - '!out/native-build/**/*'
  - '!out/native-sources/**/*'
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - third-party/**/*
extraResources:
  - from: out/agent
    to: agent
  - from: out/skill
    to: skill
  - from: resources/soundfonts
    to: soundfonts
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/mpg123-decoder/**/*
  - node_modules/js-synthesizer/**/*
  - out/renderer/libfluidsynth-2.4.6.js
  - third-party/**/*
win:
  target: nsis
  icon: resources/icon.ico
  signAndEditExecutable: true
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  license: LICENSE
  include: installer/agent.nsh
# Linux x64: a portable AppImage, and a .deb whose stable /opt path supports the agent CLI and MCP.
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  executableName: SfxChat
  # Name the .desktop entry after package.json desktopName, which Electron uses as the window app_id.
  syncDesktopName: true
  category: AudioVideo
  synopsis: Assistant-led music and sound-design workbench
  maintainer: Dorely <Dorely@users.noreply.github.com>
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}
deb:
  artifactName: ${productName}-${version}-amd64.${ext}
  afterInstall: installer/deb-after-install.sh
  afterRemove: installer/deb-after-remove.sh
npmRebuild: true
